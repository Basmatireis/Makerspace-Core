name: ${COMPOSE_PROJECT_NAME:-makerspace-core}

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-makerspace}
      POSTGRES_USER: ${POSTGRES_USER:-makerspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores versioned data below /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-makerspace}?sslmode=disable
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-6h}
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-72h}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-30m}
      AUDIT_RETENTION: ${AUDIT_RETENTION:-8760h}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-makerspace-core-api}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace/backend
      - ./api:/workspace/api:ro
      - backend_go_build:/root/.cache/go-build
      - backend_go_mod:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    init: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      VITE_DEV_API_TARGET: ${VITE_DEV_API_TARGET:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/workspace/frontend
      - ./api:/workspace/api:ro
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    init: true

  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: final
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-makerspace}?sslmode=disable
    entrypoint: ["goose", "-dir", "/app/migrations"]
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  admin:
    profiles: [tools]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: final
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-makerspace}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-6h}
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-72h}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-30m}
      AUDIT_RETENTION: ${AUDIT_RETENTION:-8760h}
    entrypoint: ["/app/admin"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  backend_go_build:
  backend_go_mod:
  frontend_node_modules:
