[package]
name = "makerspace-core-desktop-terminal"
version = "0.1.0"
description = "Native desktop shell for Makerspace Core"
authors = ["Makerspace Core contributors"]
license = "Apache-2.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
base64 = "0.22.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.9.2"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-shell = "2.3.6"
url = "2.5.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
