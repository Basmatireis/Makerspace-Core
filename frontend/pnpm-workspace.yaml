allowBuilds:
  '@carbon/charts': true
  '@carbon/charts-react': true
  '@carbon/colors': false
  '@carbon/feature-flags': false
  '@carbon/grid': false
  '@carbon/icon-helpers': false
  '@carbon/icons-react': false
  '@carbon/layout': false
  '@carbon/motion': false
  '@carbon/react': false
  '@carbon/styles': false
  '@carbon/themes': false
  '@carbon/type': false
  '@carbon/utilities': false
  '@carbon/utils-position': true
  '@ibm/plex': false
  '@ibm/plex-mono': false
  '@ibm/plex-sans': false
  '@ibm/plex-sans-arabic': false
  '@ibm/plex-sans-devanagari': false
  '@ibm/plex-sans-hebrew': false
  '@ibm/plex-sans-thai': false
  '@ibm/plex-sans-thai-looped': false
  '@ibm/plex-serif': false
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  msw: false

minimumReleaseAgeExclude:
  - fast-uri@3.1.9

# Security fixes for transitive dependencies (pnpm audit); drop once the parents require them.
overrides:
  dompurify: 3.4.16
  source-map-js: 1.2.2
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  fast-uri: 3.1.9
  js-yaml: 4.3.2
  lodash: 4.18.1
