map $http_x_forwarded_proto $makerspace_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream makerspace_backend {
    zone makerspace_backend 64k;
    server backend:8080 resolve;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Match the API's largest envelope (25 MiB PDF plus transport margin).
        # Feature services enforce the smaller image/JSON limits themselves.
        client_max_body_size 26m;
        proxy_pass http://makerspace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $makerspace_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
