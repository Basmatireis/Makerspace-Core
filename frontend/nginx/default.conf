map $http_x_forwarded_proto $makerspace_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream makerspace_backend {
    zone makerspace_backend 64k;
    server backend:8080 resolve;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location /api/ {
        # Match the API's largest envelope (512 MiB connector artifact plus
        # transport margin). Feature services enforce their smaller limits.
        client_max_body_size 513m;
        proxy_pass http://makerspace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $makerspace_forwarded_proto;
        # The API sets its own Cache-Control and per-download CSP; these apply to every response.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The standalone signage player (second Vite entry). Its hashed files live under /assets/ like the app's.
    location = /player {
        absolute_redirect off;
        return 301 /player/;
    }

    # The player's service worker (scope /player/, see src/player/sw.ts): never cached, so a new player build reaches
    # the displays on their next update check. It sits in the scope it controls, so no Service-Worker-Allowed header is needed.
    location = /player/sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-player.conf;
        try_files /player/sw.js =404;
    }

    location ^~ /player/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-player.conf;
        try_files /player.html =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        try_files $uri $uri/ /index.html;
    }
}
