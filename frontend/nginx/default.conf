# Defines $makerspace_client_allowed from FRONTEND_ALLOWED_CLIENTS (see 40-allowed-clients.sh). nginx sees
# the TCP peer address; no realip module is configured, so forwarded headers cannot widen the list.
include /etc/nginx/allowed-clients.conf;

map $http_x_forwarded_proto $makerspace_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Websocket upgrades pass Upgrade/Connection through; anything else closes the upstream connection.
map $http_upgrade $makerspace_connection_upgrade {
    default upgrade;
    "" close;
}

# Access log without secrets. The image's default "main" format writes the whole request line and the Referer to
# stdout, which would put share-link and calendar tokens, OIDC codes, reset and account parameters into the log.
# This format logs the path without its query string, masks the token segment of token URLs, and leaves out the
# Referer (same-origin requests from /survey/<token> would carry the token there).
map $request_uri $makerspace_request_path {
    "~^(?<path>[^?]*)" $path;
}

map $makerspace_request_path $makerspace_log_path {
    default $makerspace_request_path;
    "~^/survey/link/[^/]+" "/survey/link/<token>";
    "~^/survey/[^/]+" "/survey/<token>";
    "~^/api/v1/calendar/[^/]+$" "/api/v1/calendar/<token>.ics";
    "~^(?<prefix>/api/v1/public/(surveys|survey-links)/)[^/]+(?<rest>.*)$" "$prefix<token>$rest";
    "~^(?<prefix>/api/v1/terminal/survey-offers/)[^/]+(?<rest>.*)$" "$prefix<token>$rest";
}

log_format makerspace '$remote_addr [$time_local] "$request_method $makerspace_log_path $server_protocol" '
                      '$status $body_bytes_sent $request_time "$http_user_agent" "$http_x_forwarded_for"';

# The embed key of a /embed/{key} request. auth_request subrequests see the main request's $request_uri, so the
# frame-policy location below can read the key from here.
map $request_uri $embed_key {
    default "";
    "~^/embed/(?<key>[A-Za-z0-9_-]{20,64})/?(\?.*)?$" $key;
}

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream makerspace_backend {
    zone makerspace_backend 64k;
    server backend:8080 resolve;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log makerspace;

    # Clients outside FRONTEND_ALLOWED_CLIENTS get 403 before any location (including its returns) runs.
    error_page 403 @forbidden;
    if ($makerspace_client_allowed = 0) {
        return 403;
    }

    location @forbidden {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        default_type text/plain;
        return 403 "Forbidden\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location /api/ {
        # Match the API's largest envelope (512 MiB connector artifact plus
        # transport margin). Feature services enforce their smaller limits.
        client_max_body_size 513m;
        proxy_pass http://makerspace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $makerspace_forwarded_proto;
        # The API sets its own Cache-Control and per-download CSP; these apply to every response.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Camera relay websockets: the signage player's viewer socket and the printer connector's control and data
    # channels. They stay open for long, so they are neither buffered nor cut after the default 60 s of silence.
    # Every other /api/ request keeps the location above.
    location ~ ^/api/v1/(signage/player/cameras/[^/]+/stream$|public/signage/embeds/[^/]+/cameras/[^/]+/stream$|printer-connector/self/stream-) {
        proxy_pass http://makerspace_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $makerspace_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $makerspace_forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Signage web embeds: the player page, framed by other websites. Which websites may frame it differs per embed, so
    # nginx asks the API (frame-policy, always 200) and puts the answer into the CSP frame-ancestors directive.
    location ~ "^/embed/[A-Za-z0-9_-]{20,64}/?$" {
        auth_request /_embed-frame-policy;
        auth_request_set $embed_frame_ancestors $upstream_http_x_embed_frame_ancestors;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers-embed.conf;
        include /etc/nginx/snippets/csp-embed.conf;
        try_files /player.html =404;
    }

    # Any other /embed/ path is never framed; the player shows that the screen isn't available.
    location /embed/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-player.conf;
        try_files /player.html =404;
    }

    location = /_embed-frame-policy {
        internal;
        proxy_pass http://makerspace_backend/api/v1/public/signage/embeds/$embed_key/frame-policy;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $makerspace_forwarded_proto;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The standalone signage player (second Vite entry). Its hashed files live under /assets/ like the app's.
    location = /player {
        absolute_redirect off;
        return 301 /player/;
    }

    # The player's service worker (scope /player/, see src/player/sw.ts): never cached, so a new player build reaches
    # the displays on their next update check. It sits in the scope it controls, so no Service-Worker-Allowed header is needed.
    location = /player/sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-player.conf;
        try_files /player/sw.js =404;
    }

    location ^~ /player/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-player.conf;
        try_files /player.html =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        try_files $uri $uri/ /index.html;
    }
}
