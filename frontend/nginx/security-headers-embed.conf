# Response headers for the signage web embed page (/embed/{key}). The same as security-headers.conf without
# X-Frame-Options: the page is meant to be framed, and only the per-embed CSP frame-ancestors list decides by whom
# (X-Frame-Options cannot name several origins). Keep both files in step.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
