# Staff and public app. The desktop device bridge is reached on a loopback origin; Carbon and
# React set inline style attributes, so styles allow 'unsafe-inline' while scripts do not.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* http://[::1]:*; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
