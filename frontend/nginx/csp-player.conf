# Signage player. Live camera streams are relayed by Core on the player's own origin over a WebSocket (MSE), so
# connect-src needs nothing beyond 'self' (which covers ws:/wss: to the same host).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
