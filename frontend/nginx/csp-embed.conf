# Signage web embed: the player CSP, but framing is allowed for the embed's listed websites only.
# $embed_frame_ancestors comes from the API's frame-policy answer (see default.conf); an unknown key yields 'none',
# and a missing value leaves the directive empty, which browsers treat as 'none' too.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $embed_frame_ancestors" always;
