version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/people/db/queries.sql"
    gen:
      go:
        package: "peopledb"
        out: "internal/people/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides: &overrides
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
