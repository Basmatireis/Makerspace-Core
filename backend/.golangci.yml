version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - lll
    - misspell
    - nilerr
    - unconvert
    - usestdlibvars
  settings:
    depguard:
      # Layering from AGENTS.md: transport types stay in the HTTP layer. The reverse rule (no
      # sqlc rows in handlers) is TestHandlersDoNotImportRepositories in internal/httpapi,
      # because depguard cannot match the per-feature db packages with one pattern.
      rules:
        domain-without-transport:
          files:
            - "**/internal/**"
            - "!**/internal/httpapi/**"
            - "!**/internal/openapi/**"
            # Permission identifiers are generated from the PermissionId enum of the contract.
            - "!**/internal/authorization/permissions.go"
            - "!$test"
          deny:
            - pkg: "github.com/Basmatireis/Makerspace-Core/backend/internal/openapi"
              desc: services use domain types; only internal/httpapi maps OpenAPI transport types
            - pkg: "github.com/Basmatireis/Makerspace-Core/backend/internal/httpapi"
              desc: services must not depend on the HTTP layer
    lll:
      line-length: 160
      tab-width: 4
    gosec:
      excludes:
        # Integer narrowing is guarded by request validation and database constraints; the
        # generated sqlc parameters are int32 by schema.
        - G115
  exclusions:
    generated: lax
    rules:
      # Long SQL and message literals read better unbroken.
      - linters: [lll]
        source: '[`"]'
      - path: _test\.go
        linters: [bodyclose, errcheck, gosec, lll]
      # Development-only seed data generator.
      - path: cmd/devseed/
        linters: [gosec, lll]

formatters:
  enable:
    - gofmt
