# Makerspace local services: the printer connector and the camera streaming gateway (with its
# bundled go2rtc) for one makerspace network. See docs/streaming-gateway.md and
# docs/printer-connector.md. The standalone ../printer-connector/compose.yaml keeps working.
name: makerspace-local-services

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  init: true

services:
  printer-connector:
    <<: *hardened
    image: ${MAKERSPACE_IMAGE_PREFIX:-ghcr.io/basmatireis/makerspace-core}-printer-connector:${MAKERSPACE_VERSION:?Set MAKERSPACE_VERSION}
    environment:
      CORE_URL: ${CORE_URL:?Set CORE_URL to the public HTTPS Makerspace Core URL}
      CONNECTOR_DATA_DIR: /var/lib/makerspace-printer-connector
      CONNECTOR_ENROLLMENT_SECRET_FILE: /run/secrets/printer_connector_enrollment
      CONNECTOR_ALLOW_HTTP: "false"
    secrets:
      - printer_connector_enrollment
    volumes:
      - printer_connector_data:/var/lib/makerspace-printer-connector
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks: [egress]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 20s

  streaming-gateway:
    <<: *hardened
    image: ${MAKERSPACE_IMAGE_PREFIX:-ghcr.io/basmatireis/makerspace-core}-streaming-gateway:${MAKERSPACE_VERSION:?Set MAKERSPACE_VERSION}
    environment:
      CORE_URL: ${CORE_URL:?Set CORE_URL to the public HTTPS Makerspace Core URL}
      # Only compared with the public host configured in Core; a mismatch is logged as a warning.
      STREAM_PUBLIC_HOST: ${STREAM_PUBLIC_HOST:?Set STREAM_PUBLIC_HOST to the hostname[:port] players use}
      # The LAN address of THIS HOST (not the container) go2rtc advertises as its WebRTC candidate.
      STREAM_WEBRTC_CANDIDATES: ${STREAM_LAN_ADDRESS:?Set STREAM_LAN_ADDRESS to the LAN IP of this host}:8555
      STREAM_DATA_DIR: /var/lib/makerspace-streaming-gateway
      STREAM_ENROLLMENT_SECRET_FILE: /run/secrets/streaming_gateway_enrollment
      STREAM_TLS_CERT_FILE: /run/secrets/streaming_gateway_tls_cert
      STREAM_TLS_KEY_FILE: /run/secrets/streaming_gateway_tls_key
      STREAM_LISTEN_ADDR: ":8443"
      GO2RTC_API_URL: http://go2rtc:1984
      GO2RTC_CONFIG_FILE: /go2rtc-config/go2rtc.yaml
      STREAM_ALLOW_HTTP: "false"
    secrets:
      - streaming_gateway_enrollment
      - streaming_gateway_tls_cert
      - streaming_gateway_tls_key
    volumes:
      - streaming_gateway_data:/var/lib/makerspace-streaming-gateway
      - go2rtc_config:/go2rtc-config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      # The only entry point for players: ticket-protected WebRTC signalling and MSE websocket.
      - "${STREAM_BIND_ADDRESS:-0.0.0.0}:${STREAM_HTTPS_PORT:-8443}:8443"
    networks: [internal, egress]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 20s

  go2rtc:
    <<: *hardened
    # Pinned to the tag AND the verified multi-arch digest of alexxit/go2rtc 1.9.14.
    image: alexxit/go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
    # Same numeric user as the gateway so it can read the configuration file the gateway writes
    # with mode 0600 (it contains the printers' camera credentials).
    user: "10001:10001"
    command: ["go2rtc", "-config", "/config/go2rtc.yaml"]
    volumes:
      - go2rtc_config:/config:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      # WebRTC media. Players on the LAN send/receive RTP directly to this port; it cannot go
      # through the HTTPS proxy. The port number must match STREAM_LAN_ADDRESS:8555 above.
      # Port 1984 (go2rtc's HTTP API, including its web UI) and 8554 (RTSP) are NOT published.
      - "${STREAM_BIND_ADDRESS:-0.0.0.0}:8555:8555/tcp"
      - "${STREAM_BIND_ADDRESS:-0.0.0.0}:8555:8555/udp"
    networks: [internal, egress]
    depends_on:
      streaming-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1984/api/streams"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    pids_limit: 256
    mem_limit: 512m
    cpus: 2.0
    stop_grace_period: 10s

networks:
  # Gateway <-> go2rtc API traffic. No outbound access.
  internal:
    internal: true
  # Outbound access to Core and to the printers on the LAN, and the published ports.
  egress: {}

secrets:
  printer_connector_enrollment:
    file: ${CONNECTOR_ENROLLMENT_SECRET_FILE:-./secrets/printer-connector-enrollment}
  streaming_gateway_enrollment:
    file: ${STREAM_ENROLLMENT_SECRET_FILE:-./secrets/streaming-gateway-enrollment}
  streaming_gateway_tls_cert:
    file: ${STREAM_TLS_CERT_FILE:-./secrets/streaming-gateway-tls.crt}
  streaming_gateway_tls_key:
    file: ${STREAM_TLS_KEY_FILE:-./secrets/streaming-gateway-tls.key}

volumes:
  printer_connector_data:
  streaming_gateway_data:
  go2rtc_config:
