# Makerspace printer connector (stack "makerspace-connector"): runs in the makerspace network, next
# to the printers, and talks outbound to Makerspace Core. See docs/hosting.md.
#
# This one file is both the repository's production file and what the release bundle ships: the
# bundle only sets MAKERSPACE_VERSION in .env.example. For development use compose.development.yaml
# (`make dev-connector`).
name: makerspace-connector

services:
  connector:
    # MAKERSPACE_VERSION is a release (never "latest"). To pin the exact image content as well, set
    # the optional PRINTER_CONNECTOR_DIGEST in .env to "@sha256:<digest>" (see docs/hosting.md).
    image: ${MAKERSPACE_IMAGE_PREFIX:-ghcr.io/basmatireis/makerspace-core}-printer-connector:${MAKERSPACE_VERSION:?Set MAKERSPACE_VERSION}${PRINTER_CONNECTOR_DIGEST:-}
    environment:
      APP_ENV: production
      CORE_URL: ${CORE_URL:?Set CORE_URL to the public HTTPS Makerspace Core URL}
      CONNECTOR_DATA_DIR: /var/lib/makerspace-printer-connector
      # One-time secret from Core; only used until the first successful enrollment.
      CONNECTOR_ENROLLMENT_SECRET: ${CONNECTOR_ENROLLMENT_SECRET:-}
      CONNECTOR_ALLOW_HTTP: "false"
    volumes:
      - connector_data:/var/lib/makerspace-printer-connector
      # Update requests for the optional updater below (unused without it).
      - updater_exchange:/var/lib/makerspace-updater
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 20s
    restart: unless-stopped
    init: true

  # Optional updater sidecar: lets staff update this bundle to Core's version from Settings > Local
  # services. It runs only with COMPOSE_PROFILES=updater in .env; without it, update by hand
  # (docs/hosting.md). SECURITY: it mounts the Docker socket, which is root access to this host. It
  # accepts only a newer release of this bundle's own images (image names come from this file and
  # .env, never from Core), rewrites MAKERSPACE_VERSION in .env and recreates the services below.
  # The other containers never get the socket; they hand requests over through updater_exchange.
  updater:
    profiles: [updater]
    image: ${MAKERSPACE_IMAGE_PREFIX:-ghcr.io/basmatireis/makerspace-core}-local-updater:${MAKERSPACE_VERSION:?Set MAKERSPACE_VERSION}${LOCAL_UPDATER_DIGEST:-}
    environment:
      UPDATER_COMPONENTS: printer-connector
      # Never list the updater itself: it would stop itself halfway. It is updated with the next
      # manual `docker compose up -d`.
      UPDATER_SERVICES: connector
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # This bundle directory (compose.yaml and .env); the updater writes .env.
      - .:/deploy
      - updater_exchange:/var/lib/makerspace-updater
    # The engine pulls the images; the updater itself needs no network.
    network_mode: none
    cap_drop: [ALL]
    # Read and replace .env as root while keeping its owner.
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    init: true

volumes:
  connector_data:
  updater_exchange:
