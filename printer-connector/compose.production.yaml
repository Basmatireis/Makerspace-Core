name: makerspace-printer-connector

services:
  connector:
    image: ${MAKERSPACE_IMAGE_PREFIX:-ghcr.io/basmatireis/makerspace-core}-printer-connector:__MAKERSPACE_VERSION__
    environment:
      CORE_URL: ${CORE_URL:?Set CORE_URL to the public HTTPS Makerspace Core URL}
      CONNECTOR_DATA_DIR: /var/lib/makerspace-printer-connector
      CONNECTOR_ENROLLMENT_SECRET_FILE: /run/secrets/printer_connector_enrollment
      CONNECTOR_ALLOW_HTTP: "false"
      APP_ENV: production
    secrets:
      - printer_connector_enrollment
    volumes:
      - connector_data:/var/lib/makerspace-printer-connector
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 20s
    restart: unless-stopped
    init: true

secrets:
  printer_connector_enrollment:
    file: ${CONNECTOR_ENROLLMENT_SECRET_FILE:-./secrets/printer-connector-enrollment}

volumes:
  connector_data:

