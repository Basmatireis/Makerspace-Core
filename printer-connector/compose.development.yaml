# Development: the printer connector built from this checkout, next to `make dev` (Core on the host,
# port 8080). Started with `make dev-connector`; see docs/hosting.md.
name: makerspace-connector

services:
  connector:
    build:
      context: ..
      dockerfile: printer-connector/Dockerfile
      target: final
      args:
        VERSION: dev
    environment:
      APP_ENV: development
      # Core's API as seen from the container. The production CORE_URL from .env is not used here.
      CORE_URL: ${DEV_CORE_URL:-http://host.docker.internal:8080}
      CONNECTOR_ALLOW_HTTP: "true"
      CONNECTOR_DATA_DIR: /var/lib/makerspace-printer-connector
      CONNECTOR_ENROLLMENT_SECRET: ${CONNECTOR_ENROLLMENT_SECRET:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - connector_data:/var/lib/makerspace-printer-connector
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    init: true

volumes:
  connector_data:
    # The name from before the stack was renamed to makerspace-connector, so existing connectors keep
    # their enrolled identity.
    name: makerspace-printer-connector-dev_connector_data
