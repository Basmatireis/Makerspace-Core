openapi: 3.0.3
info:
  title: Makerspace Core API
  version: 0.1.0
  description: |
    HTTP contract for one makerspace deployment. OpenAPI is the transport source
    of truth; authorization and domain invariants remain backend responsibilities.

    Optional nullable fields deliberately distinguish three states: an omitted
    property is unavailable or unchanged, `null` clears or represents no value,
    and a non-null value is present. In particular, `matriculationNumber` is
    omitted from responses unless the caller has `people.read.matriculation`.

    Every session-authenticated operation also accepts the optional
    `X-Managed-Device-Token` credential declared below. OpenAPI security
    requirements cannot express an optional second credential without changing
    their boolean meaning, so the server evaluates this header independently of
    the required session and CSRF credentials.
servers:
  - url: /api/v1
    description: Same-origin application API
tags:
  - name: Health
  - name: Authentication
    description: "Every authentication-route response is emitted with `Cache-Control: no-store`, including errors."
  - name: People
  - name: Accounts
  - name: Permissions
  - name: Roles
  - name: Managed Devices
  - name: Audit
  - name: Open Days
  - name: Public Open Days
  - name: Events
  - name: Public Events
  - name: Machines
  - name: Organizations
  - name: Pricing
  - name: Machine Jobs
  - name: Inventory
  - name: Machine Logbook
  - name: Branding

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Report that the API process is running
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Report whether required dependencies are ready
      security: []
      responses:
        "200":
          description: The API can serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Start an email/password session
      description: |
        On success, sets an HttpOnly session cookie and a separate readable CSRF
        cookie. Authentication failures use one generic response regardless of
        whether the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Session created. The browser receives session and CSRF cookies.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              description: Session and CSRF cookies. Multiple Set-Cookie headers may be sent.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/pin/login:
    post:
      tags: [Authentication]
      operationId: loginWithPin
      summary: Start a low-assurance login-name/PIN session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginRequest"
      responses:
        "204":
          description: Authenticated; session and CSRF cookies are set.
          headers:
            Cache-Control: {$ref: "#/components/headers/NoStore"}
            Set-Cookie:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /auth/methods/pin:
    put:
      tags: [Authentication]
      operationId: enrollOwnPin
      summary: Enroll or replace the current account's PIN method
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnrollPinRequest"}
      responses:
        "204": {description: PIN method enrolled and other sessions revoked.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /auth/pin/enrollment/complete:
    post:
      tags: [Authentication]
      operationId: completePinEnrollment
      summary: Complete a one-time PIN enrollment challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompletePinEnrollmentRequest"}
      responses:
        "204": {description: PIN login enrolled; existing sessions were revoked.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalServerError"}
    delete:
      tags: [Authentication]
      operationId: removeOwnPin
      summary: Remove the current account's PIN method
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": {description: PIN method removed and other sessions revoked.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Session revoked and authentication cookies cleared.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              description: Expired session and CSRF cookies. Multiple Set-Cookie headers may be sent.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the authenticated principal and current permissions
      description: Permissions and account state are resolved from current server state.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current authenticated user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/password:
    put:
      tags: [Authentication]
      operationId: changeOwnPassword
      summary: Change the current account password
      description: Verifies the current password, rotates the current session, and revokes other sessions.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOwnPasswordRequest"
      responses:
        "204":
          description: Password changed and session state rotated.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              description: Rotated session and CSRF cookies. Multiple Set-Cookie headers may be sent.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Authentication]
      operationId: removeOwnPassword
      summary: Remove the current account password method
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RemoveOwnPasswordRequest"}
      responses:
        "204": {description: Password removed and all sessions revoked., headers: {Set-Cookie: {schema: {type: string}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password-reset code
      description: Returns the same accepted response for known, unknown, ineligible, rate-limited accounts and delivery failures. Synchronous delivery can affect latency; timing equality is not guaranteed. Malformed requests and infrastructure errors use the documented error responses.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
      responses:
        "202":
          description: Request accepted without disclosing account or delivery state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/password-reset/complete-code:
    post:
      tags: [Authentication]
      operationId: completePasswordResetCode
      summary: Complete password recovery with an emailed code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetCodeRequest"
      responses:
        "204":
          description: Password replaced, code consumed, and existing sessions revoked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/password-reset/complete:
    post:
      tags: [Authentication]
      operationId: completePasswordReset
      summary: Redeem a one-time password-reset token
      description: The token is accepted only in the request body and is never placed in an API URL.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "204":
          description: Password replaced, token consumed, existing sessions revoked, and stale authentication cookies cleared.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              description: Expired session and CSRF cookies when present. Multiple Set-Cookie headers may be sent.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/invitations/complete:
    post:
      tags: [Authentication]
      operationId: completeInvitation
      summary: Complete an invitation and set the initial password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteInvitationRequest"
      responses:
        "204":
          description: Invitation consumed, email verified, password set, and eligible account enabled.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/email-verification/request:
    post:
      tags: [Authentication]
      operationId: requestOwnEmailVerification
      summary: Send a verification code for the current account's local login email
      description: The challenge is committed before synchronous delivery is attempted.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "202":
          description: Verification challenge committed and delivered.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /auth/email-verification/complete:
    post:
      tags: [Authentication]
      operationId: completeEmailVerification
      summary: Verify a local login email with a one-time code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompleteEmailVerificationRequest"}
      responses:
        "204":
          description: Email verified and challenge consumed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /people:
    get:
      tags: [People]
      operationId: listPeople
      summary: List people for user administration
      description: Requires `people.read.all`; account data is omitted without `accounts.read`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          description: Case-insensitive search over permitted name and contact fields.
          schema:
            type: string
            maxLength: 200
        - name: roleIds
          in: query
          description: |
            Return people assigned to at least one of these roles. Role membership
            is Person data and is available with `people.read.all`.
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 50
            items:
              $ref: "#/components/schemas/UUIDv7"
        - name: accountStatuses
          in: query
          description: |
            Return people matching at least one account lifecycle category. Supplying
            this filter requires `accounts.read`.
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 3
            items:
              $ref: "#/components/schemas/PeopleAccountStatusFilter"
        - name: laborordnungStatuses
          in: query
          description: |
            Return people matching at least one permission-gated Lab Rules presentation
            status. `pending` means an outstanding confirmation request for the current
            published version. Supplying this filter requires `laborordnung.requests.read`.
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 5
            items:
              $ref: "#/components/schemas/PeopleLaborordnungStatusFilter"
      responses:
        "200":
          description: A page of people.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [People]
      operationId: createPerson
      summary: Create a person
      description: Requires `people.create`; matriculation input additionally requires `people.update.matriculation`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonRequest"
      responses:
        "201":
          description: Person created.
          headers:
            Location:
              description: Relative API URL of the created person.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /people/{personId}:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    get:
      tags: [People]
      operationId: getPerson
      summary: Get one person
      description: Requires the applicable `people.read.self` or `people.read.all` permission.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Person details, filtered for field-level permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [People]
      operationId: updatePerson
      summary: Update one person
      description: |
        Requires the applicable `people.update.self` or `people.update.all`
        permission. Sending `matriculationNumber` additionally requires
        `people.update.matriculation`. Omitted fields are unchanged; nullable
        fields sent as `null` are cleared.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonRequest"
      responses:
        "200":
          description: Updated person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [People]
      operationId: deletePerson
      summary: Permanently delete one person
      description: |
        Requires `people.delete`. If the person has an account, also requires
        `accounts.delete`. Audit references remain non-PII identifiers and do not
        prevent hard deletion.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "204":
          description: Person and dependent authentication data permanently deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /people/{personId}/account:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    post:
      tags: [Accounts]
      operationId: createPersonAccount
      summary: Create an account for a person
      description: Requires `accounts.create`. New accounts are active by default. If `loginEmail` is supplied, a password authentication identity is created without a password.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created.
          headers:
            Location:
              description: Relative API URL of the created account.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /people/{personId}/profile-image:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    get:
      tags: [People]
      operationId: getPersonProfileImage
      summary: Read a private normalized profile image
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Normalized JPEG profile image.
          headers:
            Cache-Control: {$ref: "#/components/headers/NoStore"}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}

    put:
      tags: [People]
      operationId: putPersonProfileImage
      summary: Validate, normalize, and replace a profile image
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: {$ref: "#/components/schemas/Version"}
        - name: X-File-Name
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
        - name: X-Profile-Image-Source
          in: header
          required: false
          schema: {type: string, enum: [terminal_capture, self_upload, admin_upload], default: self_upload}
      requestBody:
        required: true
        description: JPEG, PNG, or WebP bytes. The service verifies the actual decoded format.
        content:
          application/octet-stream: {schema: {type: string, format: binary}}
      responses:
        "200": {description: Updated profile image metadata., content: {application/json: {schema: {$ref: "#/components/schemas/ProfileImage"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {description: Image exceeds 8 MiB.}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalServerError"}
    delete:
      tags: [People]
      operationId: deletePersonProfileImage
      summary: Remove a profile image
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/VersionRequest"}}}}
      responses:
        "204": {description: Profile image removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /people/{personId}/makerspace-status:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    get:
      tags: [People]
      operationId: getPersonMakerspaceStatus
      summary: Get permission-filtered Makerspace status for one person
      description: |
        Requires the applicable `people.read.self` or `people.read.all`
        permission. Upcoming Open Day assignments are omitted without
        `open_days.read.assignments`; Lab Rules status is omitted without
        `laborordnung.requests.read`.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Makerspace-specific status visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonMakerspaceStatus"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get one account
      description: Requires `accounts.read`.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Account details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
