  /machine-logbook/work-items:
    get:
      tags: [Machine Logbook]
      operationId: listMachineLogbookWorkItems
      summary: List machine jobs and unlinked prints in one table
      description: >-
        Returns every machine job plus every print that is not linked to a job, with a unified status and the
        billing state of jobs. Array filters are comma-separated.
      security: [{sessionCookie: []}]
      parameters:
        - {name: search, in: query, description: "Matches job name, job and print display IDs and file names.", schema: {type: string, maxLength: 200}}
        - {name: status, in: query, style: form, explode: true, schema: {type: array, maxItems: 8, items: {$ref: "#/components/schemas/WorkItemStatus"}}}
        - {name: machineId, in: query, style: form, explode: true, schema: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/UUIDv7"}}}
        - {name: source, in: query, style: form, explode: true, schema: {type: array, maxItems: 2, items: {$ref: "#/components/schemas/WorkItemSource"}}}
        - {name: materialId, in: query, style: form, explode: true, schema: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/UUIDv7"}}}
        - {name: billing, in: query, style: form, explode: true, description: "Matches jobs only; prints have no billing state.", schema: {type: array, maxItems: 5, items: {$ref: "#/components/schemas/JobBillingState"}}}
        - {name: customerId, in: query, description: Person or Organization identifier., schema: {$ref: "#/components/schemas/UUIDv7"}}
        - {name: operatorPersonId, in: query, schema: {$ref: "#/components/schemas/UUIDv7"}}
        - {name: from, in: query, description: Inclusive lower bound on the start time., schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive upper bound on the start time., schema: {type: string, format: date-time}}
        - {name: sort, in: query, schema: {type: string, enum: [startedAt, name, machine, customer, price], default: startedAt}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200": {description: Work items., content: {application/json: {schema: {$ref: "#/components/schemas/WorkItemPage"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalServerError"}

