components:
  headers:
    NoStore:
      description: Prevent browsers and intermediaries from retaining authentication or one-time-secret responses.
      schema:
        type: string
        enum: [no-store]

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: makerspace_session
      description: Opaque server-side session token. Only a digest is stored; the cookie is HttpOnly. Secure production uses the `__Host-makerspace_session` name.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must exactly mirror `makerspace_csrf` (or secure production `__Host-makerspace_csrf`) on unsafe authenticated requests.
    managedDeviceToken:
      type: apiKey
      in: header
      name: X-Managed-Device-Token
      description: Optional opaque managed-device bearer credential accepted on every session-authenticated operation and injected by a trusted native client. It never replaces the user session.
    managedDeviceCookie:
      type: apiKey
      in: cookie
      name: makerspace_device
      description: HttpOnly browser-bound managed-device credential. Secure production uses the `__Host-makerspace_device` name.
    scimBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: One-time-displayed connector token stored only as a digest.
    printerConnectorBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Printer connector enrollment or machine credential. Core stores only a digest.
    eventSignupToken:
      type: apiKey
      in: header
      name: X-Event-Signup-Token
      description: One-assignment management credential stored only as a SHA-256 digest.

  parameters:
    BrandingAssetSlot:
      name: slot
      in: path
      required: true
      schema: {$ref: "#/components/schemas/BrandingAssetSlot"}
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUIDv7"
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUIDv7"
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUIDv7"
    DeviceTypeId:
      name: deviceTypeId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    ManagedDeviceId:
      name: managedDeviceId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    OpenDayPeriodId:
      name: periodId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    OpenDayId:
      name: openDayId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    OpenDayRequirementId:
      name: requirementId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    OpenDayAssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    AcademicBreakId:
      name: academicBreakId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    EventId:
      name: eventId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    EventSessionId:
      name: eventSessionId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    EventTaskListId:
      name: eventTaskListId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    EventTaskId:
      name: eventTaskId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    EventShiftId:
      name: eventShiftId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    EventRequirementId:
      name: eventRequirementId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    EventAssignmentId:
      name: eventAssignmentId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    EventFileId:
      name: eventFileId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    PublicEventId:
      name: publicId
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9_-]{43}$"}
    EventSignupTokenHeader:
      name: X-Event-Signup-Token
      in: header
      required: true
      schema: {type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$"}
    LaborordnungVersionId:
      name: laborordnungVersionId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    LaborordnungRequestId:
      name: laborordnungRequestId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    OIDCProviderId:
      name: oidcProviderId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UUIDv7"}
    Limit:
      name: limit
      in: query
      description: Maximum records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Page:
      name: page
      in: query
      description: One-based result page.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Maximum records to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
        maxLength: 500

  responses:
    BadRequest:
      description: Malformed request, invalid JSON, or unsupported query value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing, expired, revoked, disabled, or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller lacks permission or the CSRF check failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Stale `expectedVersion` (`stale_write`), uniqueness conflict, or protected invariant violation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Structurally valid input violates field or domain validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The submitted image or document exceeds its route-specific limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Security-sensitive request rate exceeded.
      headers:
        Retry-After:
          description: Seconds until another attempt may be made.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required optional integration is unavailable or delivery failed safely.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server error; internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    UUIDv7:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: Lowercase RFC 9562 UUID version 7 generated by the application.

    Version:
      type: integer
      format: int64
      minimum: 1
      description: Optimistic-concurrency version.

    Email:
      type: string
      format: email
      maxLength: 254

    ExistingPassword:
      type: string
      format: password
      minLength: 1
      maxLength: 128
      writeOnly: true
      description: Opaque existing secret. Transport decoding also enforces a 1024-byte request-field limit.

    NewPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      writeOnly: true

    PermissionId:
      type: string
      enum:
        - people.read.self
        - people.read.all
        - people.create
        - people.update.self
        - people.update.all
        - people.delete
        - people.read.matriculation
        - people.update.matriculation
        - people.profile_image.update.self
        - people.profile_image.update.all
        - people.profile_image.remove.self
        - people.profile_image.remove.all
        - accounts.read
        - accounts.create
        - accounts.delete
        - accounts.enable
        - accounts.disable
        - accounts.login_email.update
        - accounts.password.set
        - accounts.password.reset
        - accounts.password.enroll.self
        - accounts.password.enroll.all
        - accounts.password.remove.self
        - accounts.password.remove.all
        - accounts.pin.enroll.self
        - accounts.pin.enroll.all
        - accounts.pin.remove.self
        - accounts.pin.remove.all
        - accounts.pin.reset
        - people.roles.assign
        - roles.read
        - roles.manage
        - audit.read
        - open_days.read
        - open_days.read_assignments
        - open_days.signup
        - open_days.assign
        - open_days.manage
        - events.read
        - events.manage
        - events.staffing.manage
        - events.assign
        - managed_devices.read
        - managed_devices.manage
        - session_policies.manage
        - attendance.read
        - attendance.assist
        - attendance.correct
        - attendance.statistics.read
        - surveys.read
        - surveys.manage
        - laborordnung.read
        - laborordnung.manage
        - laborordnung.requests.read
        - laborordnung.confirm
        - visitor_enrollment.manage
        - supervisor_dashboard.read
        - identities.oidc.link.self
        - identities.oidc.link.all
        - identities.oidc.unlink.self
        - identities.oidc.unlink.all
        - oidc.manage
        - scim.manage
        - mail.manage
        - branding.manage
        - machines.read
        - machines.manage
        - machine_jobs.read
        - machine_jobs.create
        - machine_jobs.edit
        - orders.read
        - orders.write
        - orders.finalize
        - orders.reverse
        - payments.read
        - payments.record
        - payments.reverse
        - external_invoice_requests.read
        - external_invoice_requests.manage
        - machine_jobs.override_price
        - inventory.read
        - inventory.manage
        - filament_spools.manage
        - printer_slots.assign
        - printer_connectors.read
        - printer_connectors.manage
        - printer_connectors.credentials.manage
        - organizations.read
        - organizations.manage
        - pricing.read
        - pricing.manage
        - statistics.read

    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 100
          description: Stable machine-readable error code.
        message:
          type: string
          maxLength: 500
          description: Safe human-readable summary.
        details:
          type: object
          additionalProperties: true
          description: Safe structured context, such as field validation errors.
        requestId:
          type: string
          minLength: 1
          maxLength: 200

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/ExistingPassword"

    PinLoginRequest:
      type: object
      additionalProperties: false
      required: [loginName, pin]
      properties:
        loginName:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        pin:
          type: string
          format: password
          minLength: 6
          maxLength: 12
          pattern: "^[0-9]{6,12}$"
          writeOnly: true

    EnrollPinRequest:
      type: object
      additionalProperties: false
      required: [loginName, pin]
      properties:
        loginName:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        pin:
          type: string
          format: password
          minLength: 6
          maxLength: 12
          pattern: "^[0-9]{6,12}$"
          writeOnly: true

    CompletePinEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [accountId, code, loginName, pin]
      properties:
        accountId: {$ref: "#/components/schemas/UUIDv7"}
        code:
          type: string
          minLength: 8
          maxLength: 8
          pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz]{8}$"
        loginName:
          type: string
          minLength: 3
          maxLength: 64
