        spoolDisplayId: {type: string, nullable: true}
        fillNumber: {type: integer, nullable: true}
        fromSpoolId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        fromSpoolDisplayId: {type: string, nullable: true}
        fromFillNumber: {type: integer, nullable: true}
        toSpoolId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        toSpoolDisplayId: {type: string, nullable: true}
        toFillNumber: {type: integer, nullable: true}
        transferQuantity: {allOf: [{$ref: "#/components/schemas/Decimal"}], nullable: true}
