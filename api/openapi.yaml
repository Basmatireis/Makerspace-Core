        kind: {type: string, enum: [barcode, qr, nfc]}
        value: {type: string}
        createdAt: {type: string, format: date-time}

    FilamentSpool:
      type: object
      additionalProperties: false
      description: >-
        Material, product, weights and identifiers describe the current (open) fill. A reusable spool without an open
        fill needs a refill; its material fields are null and remainingQuantity is 0.
      required: [id, displayId, kind, status, fillNumber, remainingQuantity, lifecycle, mounted, identifiers, version, createdAt, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        displayId: {type: string}
        kind: {$ref: "#/components/schemas/FilamentSpoolKind"}
        label: {type: string, nullable: true}
        status: {$ref: "#/components/schemas/FilamentSpoolStatus"}
        fillNumber: {type: integer, minimum: 1, description: The open fill or the most recent closed one.}
        fillId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true, description: Open fill.}
        filledAt: {type: string, format: date-time, nullable: true}
        archivedAt: {type: string, format: date-time, nullable: true}
        materialId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        materialName: {type: string, nullable: true}
        category: {type: string, nullable: true}
        color: {type: string, nullable: true}
        unit: {allOf: [{$ref: "#/components/schemas/MaterialUnit"}], nullable: true}
        productId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        manufacturer: {type: string, nullable: true, description: Snapshot taken when the fill started.}
        productName: {type: string, nullable: true, description: Snapshot taken when the fill started.}
        initialNetWeightG: {allOf: [{$ref: "#/components/schemas/Decimal"}], nullable: true}
        remainingQuantity: {$ref: "#/components/schemas/Decimal"}
        tareWeightG: {allOf: [{$ref: "#/components/schemas/Decimal"}], nullable: true}
        acquiredOn: {type: string, format: date, nullable: true}
        acquisitionReference: {type: string, nullable: true}
        storageLocation: {type: string, nullable: true}
        notes: {type: string, nullable: true}
        lifecycle: {type: string, enum: [active, archived]}
        mounted: {type: boolean}
        mountedOn: {$ref: "#/components/schemas/FilamentSpoolMount"}
        identifiers: {type: array, items: {$ref: "#/components/schemas/FilamentSpoolIdentifier"}, description: Identifiers of the open fill.}
        fills: {type: array, items: {$ref: "#/components/schemas/FilamentSpoolFill"}, description: "Closed fills, newest first; only returned by GET /filament-spools/{spoolId}."}
        version: {$ref: "#/components/schemas/Version"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    FilamentSpoolMount:
      type: object
      nullable: true
      additionalProperties: false
      required: [machineId, machineName, slotId, slotName]
      properties:
        machineId: {$ref: "#/components/schemas/UUIDv7"}
        machineName: {type: string}
        inputUnitName: {type: string, nullable: true}
        slotId: {$ref: "#/components/schemas/UUIDv7"}
        slotName: {type: string}

    FilamentSpoolKind:
      type: string
      description: reusable spools are refilled; single_use spools are archived once finished.
      enum: [reusable, single_use]

    FilamentSpoolStatus:
      type: string
      description: "loaded and needs_refill for reusable spools, active for single-use spools, archived for both."
      enum: [loaded, needs_refill, active, archived]

    FilamentPackaging:
      type: string
      description: refill comes without a spool (for reusable spools); spool comes on its own single-use spool.
      enum: [refill, spool]

    FilamentSpoolFill:
      type: object
      additionalProperties: false
      required: [id, fillNumber, materialId, materialName, initialNetWeightG, usedG, leftoverG, leftoverOutcome, filledAt, closedAt, identifiers]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        fillNumber: {type: integer, minimum: 1}
        materialId: {$ref: "#/components/schemas/UUIDv7"}
        materialName: {type: string}
        productId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        manufacturer: {type: string, nullable: true}
        productName: {type: string, nullable: true}
        initialNetWeightG: {$ref: "#/components/schemas/Decimal"}
        usedG: {$ref: "#/components/schemas/Decimal"}
        leftoverG: {$ref: "#/components/schemas/Decimal"}
        leftoverOutcome: {$ref: "#/components/schemas/LeftoverOutcome"}
        filledAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time}
        identifiers: {type: array, items: {$ref: "#/components/schemas/FilamentSpoolIdentifier"}}

    LeftoverOutcome:
      type: string
      enum: [used_up, returned_to_stock, disposed]

    FilamentLeftoverInput:
      type: object
      additionalProperties: false
      required: [basis]
      description: >-
        system keeps the recorded remaining quantity; weighed uses grossWeightG minus the spool's tare weight and
        records the difference as a correction; none writes the remaining quantity off as used up. A leftover above
        zero needs a disposition.
      properties:
        basis: {type: string, enum: [system, weighed, none]}
        grossWeightG: {allOf: [{$ref: "#/components/schemas/Decimal"}], nullable: true}
        disposition: {type: string, enum: [returned_to_stock, disposed], nullable: true}

    FilamentNewFillInput:
      type: object
      additionalProperties: false
      required: [materialId, netWeightG, source]
      properties:
        productId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true, description: "When set, materialId must be the product's material."}
        materialId: {$ref: "#/components/schemas/UUIDv7"}
        manufacturer: {type: string, maxLength: 150, nullable: true}
        productName: {type: string, maxLength: 200, nullable: true}
        netWeightG: {$ref: "#/components/schemas/Decimal"}
        source: {type: string, enum: [loose_stock, purchase], description: "loose_stock moves grams from loose stock onto the spool (total unchanged); purchase adds stock."}
        totalPrice: {allOf: [{$ref: "#/components/schemas/Money"}], nullable: true, description: Required for purchase.}
        supplier: {type: string, maxLength: 200, nullable: true}

    NewFilamentSpoolIdentifier:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: {type: string, enum: [barcode, qr, nfc]}
        value: {type: string, minLength: 1, maxLength: 255}

    ChangeFilamentSpoolFillRequest:
      type: object
      additionalProperties: false
      required: [fill, keepIdentifierIds, newIdentifiers, occurredAt, expectedVersion]
      properties:
