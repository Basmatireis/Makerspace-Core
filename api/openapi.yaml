        visitorHours: {$ref: "#/components/schemas/Decimal"}
        peakOccupancy: {type: integer, format: int64, minimum: 0}
        currentOccupancy: {type: integer, format: int64, minimum: 0}
        averageCompletedVisitMinutes: {$ref: "#/components/schemas/Decimal"}

    SurveyQuestionKind:
      type: string
      enum: [single_choice, multiple_choice, free_text, rating, yes_no]
    SurveyOptionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: {type: string, minLength: 1, maxLength: 500}
    SurveyQuestionInput:
      type: object
      additionalProperties: false
      required: [kind, prompt, required, options]
      properties:
        kind: {$ref: "#/components/schemas/SurveyQuestionKind"}
        prompt: {type: string, minLength: 1, maxLength: 1000}
        required: {type: boolean}
        options: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/SurveyOptionInput"}}
        ratingMin: {type: integer, minimum: 0, maximum: 9, nullable: true}
        ratingMax: {type: integer, minimum: 1, maximum: 10, nullable: true}
    SurveyOption:
      allOf:
        - {$ref: "#/components/schemas/SurveyOptionInput"}
        - type: object
          additionalProperties: false
          required: [id, position]
          properties:
            id: {$ref: "#/components/schemas/UUIDv7"}
            position: {type: integer, minimum: 1}
    SurveyQuestion:
      allOf:
        - {$ref: "#/components/schemas/SurveyQuestionInput"}
        - type: object
          additionalProperties: false
          required: [id, position]
          properties:
            id: {$ref: "#/components/schemas/UUIDv7"}
            position: {type: integer, minimum: 1}
            options: {type: array, items: {$ref: "#/components/schemas/SurveyOption"}}
    CreateSurveyRequest:
      type: object
      additionalProperties: false
      required: [name, title, description, introduction, anonymous, questions]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000, nullable: true}
        introduction: {type: string, maxLength: 5000, nullable: true}
        anonymous: {type: boolean}
        questions: {type: array, minItems: 1, maxItems: 100, items: {$ref: "#/components/schemas/SurveyQuestionInput"}}
    UpdateSurveyRequest:
      allOf:
        - {$ref: "#/components/schemas/CreateSurveyRequest"}
        - type: object
          additionalProperties: false
          required: [expectedVersion]
          properties:
            expectedVersion: {$ref: "#/components/schemas/Version"}
    SurveyTrigger:
      type: object
      additionalProperties: false
      required: [id, kind, enabled, delaySeconds, cooldownDays, version]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        kind: {type: string, enum: [visit_checked_out]}
        enabled: {type: boolean}
        delaySeconds: {type: integer, minimum: 0, maximum: 604800}
        cooldownDays: {type: integer, minimum: 0, maximum: 3650}
        version: {$ref: "#/components/schemas/Version"}
    SurveyTriggerInput:
      type: object
      additionalProperties: false
      required: [enabled, delaySeconds, cooldownDays, expectedVersion]
      properties:
        enabled: {type: boolean}
        delaySeconds: {type: integer, minimum: 0, maximum: 604800}
        cooldownDays: {type: integer, minimum: 0, maximum: 3650}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    Survey:
      type: object
      additionalProperties: false
      required: [id, name, description, status, anonymous, title, introduction, revision, questions, trigger, version, createdAt, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        name: {type: string}
        description: {type: string, nullable: true}
        status: {type: string, enum: [draft, published, closed]}
        anonymous: {type: boolean}
        title: {type: string}
        introduction: {type: string, nullable: true}
        revision: {type: integer, minimum: 1}
        questions: {type: array, items: {$ref: "#/components/schemas/SurveyQuestion"}}
        trigger:
          allOf: [{$ref: "#/components/schemas/SurveyTrigger"}]
          nullable: true
        version: {$ref: "#/components/schemas/Version"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SurveyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Survey"}}
    PublicSurvey:
      type: object
      additionalProperties: false
      required: [title, introduction, anonymous, questions, expiresAt]
      properties:
        title: {type: string}
        introduction: {type: string, nullable: true}
        anonymous: {type: boolean}
        questions: {type: array, items: {$ref: "#/components/schemas/SurveyQuestion"}}
        expiresAt: {type: string, format: date-time}
    SurveyAnswerInput:
      type: object
      additionalProperties: false
      required: [questionId, optionIds]
      properties:
        questionId: {$ref: "#/components/schemas/UUIDv7"}
        optionIds: {type: array, uniqueItems: true, maxItems: 50, items: {$ref: "#/components/schemas/UUIDv7"}}
        textValue: {type: string, maxLength: 5000, nullable: true}
        numericValue: {type: integer, nullable: true}
        booleanValue: {type: boolean, nullable: true}
    SubmitSurveyResponse:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/SurveyAnswerInput"}}
