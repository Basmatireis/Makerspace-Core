        packaging: {$ref: "#/components/schemas/FilamentPackaging"}
        notes: {type: string, nullable: true}
        active: {type: boolean}
        inUseCount: {type: integer, format: int64, minimum: 0, description: Non-archived spools whose open fill uses this product.}
