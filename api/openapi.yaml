    post:
      tags: [SCIM Administration]
      operationId: reconcileSCIMAccount
      summary: Atomically reconcile a conflict-free provisional SCIM Account into an established Account
      description: Applies the same lifecycle and role-delegation checks as preflight under transaction locks. scim.manage alone cannot transfer roles, and master roles are never transferred.
