        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalServerError"}
    put:
      tags: [Machine Runs]
      operationId: attachMachineRun
      summary: Attach an unassigned recorded run to a job on the same machine
      description: >-
        replaceManualRuns marks the job's manual runs as replaced (their material usage is reversed with compensating
        inventory transactions), so the recorded run stands in for the manually entered work. The run may still be
        running.
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AttachMachineRunRequest"}}}}
      responses:
        "200": {description: Run attached., content: {application/json: {schema: {$ref: "#/components/schemas/MachineJob"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalServerError"}
    delete:
      tags: [Machine Runs]
      operationId: detachMachineRun
      summary: Detach a recorded run from its job
      description: >-
        The run keeps its material usage and consumption. When it was the job's last run, the job gets a manual run
        with the same start, end and outcome but no material usage.
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DetachMachineRunRequest"}}}}
      responses:
        "200": {description: Run detached; returns the job., content: {application/json: {schema: {$ref: "#/components/schemas/MachineJob"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalServerError"}

