        pageSize: {type: integer, minimum: 1}
        total: {type: integer, format: int64, minimum: 0}

    FilamentProductInput:
      type: object
      additionalProperties: false
      required: [manufacturer, name, materialId, netWeightG, packaging]
      properties:
        manufacturer: {type: string, minLength: 1, maxLength: 150}
        name: {type: string, minLength: 1, maxLength: 200}
        materialId: {$ref: "#/components/schemas/UUIDv7"}
        netWeightG: {$ref: "#/components/schemas/Decimal"}
        defaultPrice: {allOf: [{$ref: "#/components/schemas/Money"}], nullable: true}
        packaging: {$ref: "#/components/schemas/FilamentPackaging"}
        notes: {type: string, maxLength: 2000, nullable: true}

    UpdateFilamentProductRequest:
      type: object
      additionalProperties: false
      required: [manufacturer, name, materialId, netWeightG, packaging, active, expectedVersion]
      properties:
        manufacturer: {type: string, minLength: 1, maxLength: 150}
        name: {type: string, minLength: 1, maxLength: 200}
        materialId: {$ref: "#/components/schemas/UUIDv7"}
        netWeightG: {$ref: "#/components/schemas/Decimal"}
        defaultPrice: {allOf: [{$ref: "#/components/schemas/Money"}], nullable: true}
        packaging: {$ref: "#/components/schemas/FilamentPackaging"}
        notes: {type: string, maxLength: 2000, nullable: true}
        active: {type: boolean}
        expectedVersion: {$ref: "#/components/schemas/Version"}

    FilamentSpoolPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/FilamentSpool"}}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1}
        total: {type: integer, format: int64, minimum: 0}

    CreateFilamentSpoolRequest:
      type: object
      additionalProperties: false
      required: [stockMode, occurredAt]
      properties:
        kind: {allOf: [{$ref: "#/components/schemas/FilamentSpoolKind"}], default: single_use}
        label: {type: string, minLength: 1, maxLength: 120, nullable: true}
        productId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true, description: "When set, materialId must be the product's material."}
        materialId: {$ref: "#/components/schemas/UUIDv7"}
        initialNetWeightG: {$ref: "#/components/schemas/Decimal"}
        stockMode:
          type: string
          enum: [new_acquisition, existing_stock, empty]
          description: >-
            new_acquisition records a purchase for the first fill, existing_stock moves loose stock onto it, empty
            registers a reusable spool without a fill (materialId and initialNetWeightG are then ignored).
        supplier: {type: string, maxLength: 200, nullable: true}
        totalPrice: {allOf: [{$ref: "#/components/schemas/Money"}], nullable: true}
        manufacturer: {type: string, maxLength: 150, nullable: true}
        productName: {type: string, maxLength: 200, nullable: true}
        tareWeightG: {allOf: [{$ref: "#/components/schemas/Decimal"}], nullable: true}
        acquiredOn: {type: string, format: date, nullable: true}
        acquisitionReference: {type: string, maxLength: 200, nullable: true}
        storageLocation: {type: string, maxLength: 200, nullable: true}
        notes: {type: string, maxLength: 2000, nullable: true}
        occurredAt: {type: string, format: date-time}
        expectedInventoryVersion: {$ref: "#/components/schemas/Version"}

    UpdateFilamentSpoolRequest:
      type: object
      additionalProperties: false
      required: [lifecycle, expectedVersion]
      description: manufacturer and productName edit the open fill's snapshot. Archiving unmounts the spool.
      properties:
        kind: {$ref: "#/components/schemas/FilamentSpoolKind"}
        label: {type: string, minLength: 1, maxLength: 120, nullable: true}
        manufacturer: {type: string, maxLength: 150, nullable: true}
        productName: {type: string, maxLength: 200, nullable: true}
        tareWeightG: {allOf: [{$ref: "#/components/schemas/Decimal"}], nullable: true}
        acquiredOn: {type: string, format: date, nullable: true}
        acquisitionReference: {type: string, maxLength: 200, nullable: true}
        storageLocation: {type: string, maxLength: 200, nullable: true}
        notes: {type: string, maxLength: 2000, nullable: true}
        lifecycle: {type: string, enum: [active, archived]}
        expectedVersion: {$ref: "#/components/schemas/Version"}

    AddFilamentSpoolIdentifierRequest:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: {type: string, enum: [barcode, qr, nfc]}
        value: {type: string, minLength: 1, maxLength: 255}

    SpoolInventoryCommand:
      type: object
      additionalProperties: false
      required: [quantity, occurredAt, expectedInventoryVersion, expectedSpoolVersion]
      properties:
        quantity: {$ref: "#/components/schemas/Decimal"}
        disposal: {type: boolean, default: false}
        reason: {allOf: [{$ref: "#/components/schemas/InventoryAdjustmentReason"}], nullable: true}
        note: {type: string, maxLength: 1000, nullable: true}
        occurredAt: {type: string, format: date-time}
        expectedInventoryVersion: {$ref: "#/components/schemas/Version"}
        expectedSpoolVersion: {$ref: "#/components/schemas/Version"}

    CorrectSpoolStockRequest:
      type: object
      additionalProperties: false
      required: [physicalQuantity, reason, occurredAt, expectedInventoryVersion, expectedSpoolVersion]
      properties:
        physicalQuantity: {$ref: "#/components/schemas/Decimal"}
        reason: {$ref: "#/components/schemas/InventoryAdjustmentReason"}
        acquisitionUnitCost: {allOf: [{$ref: "#/components/schemas/Decimal"}], nullable: true}
        note: {type: string, maxLength: 1000, nullable: true}
        occurredAt: {type: string, format: date-time}
        expectedInventoryVersion: {$ref: "#/components/schemas/Version"}
        expectedSpoolVersion: {$ref: "#/components/schemas/Version"}

    TransferSpoolStockRequest:
      type: object
      additionalProperties: false
      required: [quantity, occurredAt, expectedInventoryVersion]
      properties:
        fromSpoolId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        toSpoolId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        quantity: {$ref: "#/components/schemas/Decimal"}
        note: {type: string, maxLength: 1000, nullable: true}
        occurredAt: {type: string, format: date-time}
        expectedInventoryVersion: {$ref: "#/components/schemas/Version"}

    PrinterProfile:
      type: object
      additionalProperties: false
      required: [machineId, machineName, enabled, inputUnits, slots, version, createdAt, updatedAt]
      properties:
        machineId: {$ref: "#/components/schemas/UUIDv7"}
        machineName: {type: string}
        enabled: {type: boolean}
        inputUnits: {type: array, items: {$ref: "#/components/schemas/PrinterInputUnit"}}
        slots: {type: array, items: {$ref: "#/components/schemas/PrinterSlot"}}
        version: {$ref: "#/components/schemas/Version"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    PrinterInputUnit:
      type: object
      additionalProperties: false
      required: [id, machineId, name, position, enabled, version]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        machineId: {$ref: "#/components/schemas/UUIDv7"}
        name: {type: string}
        position: {type: integer, minimum: 0}
        externalIdentifier: {type: string, nullable: true}
        enabled: {type: boolean}
        version: {$ref: "#/components/schemas/Version"}

    PrinterSlot:
      type: object
      additionalProperties: false
      required: [id, inputUnitId, inputUnitName, machineId, name, position, status, version]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        inputUnitId: {$ref: "#/components/schemas/UUIDv7"}
        inputUnitName: {type: string}
        machineId: {$ref: "#/components/schemas/UUIDv7"}
        name: {type: string}
        position: {type: integer, minimum: 0}
        externalIdentifier: {type: string, nullable: true}
        status: {type: string, enum: [available, unavailable, retired]}
        assignmentId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        spoolId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        spoolDisplayId: {type: string, nullable: true}
        mountedAt: {type: string, format: date-time, nullable: true}
        version: {$ref: "#/components/schemas/Version"}

    ConfigurePrinterRequest:
      type: object
      additionalProperties: false
      required: [enabled, expectedVersion]
      properties:
        enabled: {type: boolean}
        expectedVersion: {type: integer, format: int64, minimum: 0}

    CreatePrinterInputUnitRequest:
      type: object
      additionalProperties: false
      required: [name, position]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        position: {type: integer, minimum: 0}
        externalIdentifier: {type: string, maxLength: 200, nullable: true}

    CreatePrinterSlotRequest:
      type: object
      additionalProperties: false
      required: [name, position, status]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        position: {type: integer, minimum: 0}
        status: {type: string, enum: [available, unavailable, retired]}
        externalIdentifier: {type: string, maxLength: 200, nullable: true}

    MountSpoolRequest:
      type: object
      additionalProperties: false
      required: [spoolId]
      properties:
        spoolId: {$ref: "#/components/schemas/UUIDv7"}

    MachineJobOutcome:
      type: string
      enum: [successful, partial_failure, failed, cancelled, unknown]

    PricingStatus:
      type: string
      enum: [pending, complete, incomplete]

    MachineRunSource:
      type: string
      description: manual runs are entered by staff; recorded runs are reported by a machine connector.
      enum: [manual, recorded]

    MachineRunState:
      type: string
      description: >-
        running while a recorded run is reported as running or a manual run's end lies in the future. replaced: a
        manual run that a recorded run stands in for (kept for history; excluded from the job's totals).
      enum: [running, finished, failed, cancelled, unknown, replaced]

    MachineRunOutcome:
      type: string
      enum: [successful, partial_failure, failed, cancelled]

    MachineRunJobReference:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, displayId]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        displayId: {type: string}
        title: {type: string, nullable: true}

    MachineRunReportedUsage:
      type: object
      nullable: true
      additionalProperties: false
      required: [quantity, quantityBasis]
      properties:
        quantity: {allOf: [{$ref: "#/components/schemas/Decimal"}], description: Grams reported by the machine.}
        quantityBasis: {$ref: "#/components/schemas/QuantityBasis"}
        spoolId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        spoolDisplayId: {type: string, nullable: true}
        materialId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        materialName: {type: string, nullable: true}

    MachineRun:
      type: object
      additionalProperties: false
      required: [id, displayId, machineId, machineName, source, state, startedAt, durationSeconds, usages, usagesFromMachine, outcomeFromMachine, version]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        displayId: {type: string}
        machineId: {$ref: "#/components/schemas/UUIDv7"}
        machineName: {type: string}
        source: {$ref: "#/components/schemas/MachineRunSource"}
        state: {$ref: "#/components/schemas/MachineRunState"}
        job: {$ref: "#/components/schemas/MachineRunJobReference"}
        connectorName: {type: string, nullable: true}
        fileName: {type: string, nullable: true, description: File or program name reported by the machine; read-only.}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time, nullable: true}
        estimatedEndAt: {type: string, format: date-time, nullable: true}
        durationSeconds: {type: integer, format: int64, minimum: 0, description: Until now or the estimated end while running.}
        progressPercent: {type: integer, minimum: 0, maximum: 100, nullable: true}
        outcome: {allOf: [{$ref: "#/components/schemas/MachineRunOutcome"}], nullable: true, description: Null until recorded.}
        outcomeFromMachine: {type: boolean, description: The outcome was set from the machine's final state and not changed by staff.}
        usages: {type: array, items: {$ref: "#/components/schemas/MachineJobUsage"}}
        usagesFromMachine: {type: boolean, description: The usage was consumed automatically from the machine's report.}
        reportedUsage: {$ref: "#/components/schemas/MachineRunReportedUsage"}
        version: {$ref: "#/components/schemas/Version"}

    MachineRunEvent:
      type: object
      additionalProperties: false
      required: [id, kind, occurredAt]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        kind: {type: string, enum: [identity, connectivity, operational_state, progress, slot_observation, consumption_report, terminal_outcome]}
        occurredAt: {type: string, format: date-time}
        state: {type: string, nullable: true, description: Operational state or terminal outcome reported by the machine.}
        progressPercent: {type: integer, minimum: 0, maximum: 100, nullable: true}
        quantity: {allOf: [{$ref: "#/components/schemas/Decimal"}], nullable: true, description: Reported grams (consumption reports).}

    MachineRunDetail:
      allOf:
        - {$ref: "#/components/schemas/MachineRun"}
        - type: object
          required: [events]
          properties:
            events: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/MachineRunEvent"}}

    MachineRunPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/MachineRun"}}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1}
        total: {type: integer, format: int64, minimum: 0}

    MachineRunUpdateResult:
      type: object
      additionalProperties: false
      required: [run]
      properties:
        run: {$ref: "#/components/schemas/MachineRun"}
        job: {allOf: [{$ref: "#/components/schemas/MachineJob"}], nullable: true}

    ManualRunInput:
      type: object
      description: >-
        An endsAt in the future starts a run that shows as running until then; outcome must then be null and is
        recorded later.
      additionalProperties: false
      required: [startsAt, endsAt, usages]
      properties:
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        outcome: {allOf: [{$ref: "#/components/schemas/MachineRunOutcome"}], nullable: true}
        usages: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/MachineJobUsageInput"}}

    UpdateMachineRunRequest:
      type: object
      additionalProperties: false
      required: [outcome, expectedVersion]
      properties:
        startsAt: {type: string, format: date-time, description: Manual runs only.}
        endsAt: {type: string, format: date-time, description: Manual runs only.}
        outcome: {allOf: [{$ref: "#/components/schemas/MachineRunOutcome"}], nullable: true, description: "Must be null while the run is running."}
        expectedVersion: {$ref: "#/components/schemas/Version"}

    ReplaceMachineRunUsagesRequest:
      type: object
      additionalProperties: false
      required: [usages, expectedVersion]
      properties:
        usages: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/MachineJobUsageInput"}}
        expectedVersion: {$ref: "#/components/schemas/Version"}

    AddManualMachineRunRequest:
      type: object
      additionalProperties: false
      required: [run, expectedJobVersion]
      properties:
        run: {$ref: "#/components/schemas/ManualRunInput"}
        expectedJobVersion: {$ref: "#/components/schemas/Version"}

    CreateMachineJobFromRunRequest:
      type: object
      additionalProperties: false
      required: [customer, operatorPersonId]
      properties:
        title: {type: string, minLength: 1, maxLength: 200, nullable: true}
        customer: {$ref: "#/components/schemas/BillingPartyReference"}
        operatorPersonId: {$ref: "#/components/schemas/UUIDv7"}
        notes: {type: string, maxLength: 2000, nullable: true}
        pricingGroupId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}

    AttachMachineRunRequest:
      type: object
      additionalProperties: false
      required: [machineJobId, replaceManualRuns, expectedJobVersion]
      properties:
        machineJobId: {$ref: "#/components/schemas/UUIDv7"}
        replaceManualRuns: {type: boolean}
        expectedJobVersion: {$ref: "#/components/schemas/Version"}

    DetachMachineRunRequest:
      type: object
      additionalProperties: false
      required: [expectedJobVersion]
      properties:
        expectedJobVersion: {$ref: "#/components/schemas/Version"}

    MachineJobStatus:
      type: string
      description: >-
        Derived at read time. running: at least one of the job's runs is running. needs_outcome: all runs have ended
        and the job's outcome is neither overridden nor derivable because a run has no outcome. Otherwise the job's
        outcome.
      enum: [running, needs_outcome, successful, partial_failure, failed, cancelled]

    PriceAdjustmentKind:
      type: string
      enum: [fixed, discount_percent, discount_amount, multiplier]

    MachineJobPriceAdjustment:
      type: object
      nullable: true
      additionalProperties: false
      required: [kind, value, reason, adjustedAt]
      properties:
        kind: {$ref: "#/components/schemas/PriceAdjustmentKind"}
        value:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          description: fixed and discount_amount in EUR, discount_percent in percent (0-100], multiplier as a factor (0-100].
        reason: {type: string}
        adjustedAt: {type: string, format: date-time}

    SetMachineJobPriceAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [kind, value, reason, expectedVersion]
      properties:
        kind: {$ref: "#/components/schemas/PriceAdjustmentKind"}
        value: {$ref: "#/components/schemas/Decimal"}
        reason: {type: string, minLength: 1, maxLength: 500}
        expectedVersion: {$ref: "#/components/schemas/Version"}

    MachineJobUsageInput:
      type: object
      additionalProperties: false
      required: [ownership, quantity, quantityBasis]
      properties:
        ownership: {$ref: "#/components/schemas/FilamentOwnership"}
        materialId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        spoolId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        externalMaterialName: {type: string, minLength: 1, maxLength: 200, nullable: true}
        quantity: {$ref: "#/components/schemas/Decimal"}
        quantityBasis: {$ref: "#/components/schemas/QuantityBasis"}

    MachineJobUsage:
      type: object
      additionalProperties: false
      required: [id, ownership, materialName, category, unit, quantity, quantityBasis]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        ownership: {$ref: "#/components/schemas/FilamentOwnership"}
        materialId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        spoolId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        spoolDisplayId: {type: string, nullable: true, description: Snapshot; kept when the spool was deleted (spoolId null).}
        fillNumber: {type: integer, nullable: true}
        materialName: {type: string}
        category: {type: string}
        unit: {$ref: "#/components/schemas/MaterialUnit"}
        quantity: {$ref: "#/components/schemas/Decimal"}
        quantityBasis: {$ref: "#/components/schemas/QuantityBasis"}

    FilamentOwnership:
      type: string
      enum: [makerspace, external]

    QuantityBasis:
      type: string
      enum: [estimated, actual]

    PricingSnapshotRule:
      type: object
      additionalProperties: false
      required: [kind, label, selector, unit, missing]
      properties:
        sourceRuleId: {allOf: [{$ref: "#/components/schemas/UUIDv7"}], nullable: true}
        kind: {$ref: "#/components/schemas/PricingRuleKind"}
        label: {type: string}
        selector: {type: string}
        unit: {type: string}
        rate: {allOf: [{$ref: "#/components/schemas/Decimal"}], nullable: true}
        missing: {type: boolean}

    MachineJobPricingSnapshot:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, revision, pricingGroupName, currency, reason, complete, rules, capturedAt]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        revision: {type: integer, minimum: 1}
        pricingGroupName: {type: string}
        currency: {type: string, enum: [EUR]}
        reason: {type: string, enum: [initial, customer_changed, machine_changed, manual_reprice]}
        complete: {type: boolean}
        calculatedAmount: {allOf: [{$ref: "#/components/schemas/Money"}], nullable: true}
        rules: {type: array, items: {$ref: "#/components/schemas/PricingSnapshotRule"}}
        capturedAt: {type: string, format: date-time}

    MachineJob:
      type: object
      additionalProperties: false
      required: [id, displayId, machine, runs, durationSeconds, outcome, outcomeOverridden, status, pricingStatus, version, createdAt, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/UUIDv7"}
        displayId: {type: string}
        title: {type: string, nullable: true, description: Optional staff-chosen name.}
        machine: {$ref: "#/components/schemas/Machine"}
        runs: {type: array, items: {$ref: "#/components/schemas/MachineRun"}, description: "Oldest first, including replaced manual runs."}
        startedAt: {type: string, format: date-time, nullable: true, description: Start of the earliest run.}
        endedAt: {type: string, format: date-time, nullable: true, description: End of the latest run; null while a run is running.}
        expectedEndAt: {type: string, format: date-time, nullable: true, description: Planned or estimated end while running.}
        durationSeconds: {type: integer, format: int64, minimum: 0, description: Sum of the runtime of all runs that are not replaced.}
        customer: {allOf: [{$ref: "#/components/schemas/BillingParty"}], nullable: true}
        operator: {allOf: [{$ref: "#/components/schemas/Operator"}], nullable: true}
        outcome:
          allOf: [{$ref: "#/components/schemas/MachineJobOutcome"}]
          description: >-
            The staff override, otherwise derived from the runs (all successful, cancelled or failed gives that outcome;
            a mix gives partial_failure; unknown while a run has no outcome).
        outcomeOverridden: {type: boolean}
        status: {$ref: "#/components/schemas/MachineJobStatus"}
        notes: {type: string, nullable: true}
        pricingStatus: {$ref: "#/components/schemas/PricingStatus"}
        pricingSnapshot: {$ref: "#/components/schemas/MachineJobPricingSnapshot"}
        calculatedPrice: {allOf: [{$ref: "#/components/schemas/Money"}], nullable: true}
