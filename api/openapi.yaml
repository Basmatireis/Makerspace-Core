      responses:
        "204":
          description: Account, identities, sessions, and reset tokens deleted. The Person and their role assignments remain.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
