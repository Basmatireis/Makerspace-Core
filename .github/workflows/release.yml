name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate stable semantic version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must have the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  # Reuse a green CI run instead of validating the same commit twice. The shortcut is deliberately
  # narrow: it needs a successful push run of ci.yml on main for exactly this commit. Anything else
  # (no run yet, still running, failed, cancelled, API error, a docs-only commit that CI ignores)
  # means "not proven", and the complete validation below runs.
  ci-status:
    name: Existing CI result
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - name: Look for a successful CI run of this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          passed=false
          if runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&event=push&branch=main&status=success&per_page=5" --jq '[.workflow_runs[] | select(.head_sha == env.COMMIT and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length')"; then
            if [ "${runs:-0}" -ge 1 ]; then
              passed=true
            fi
          fi
          echo "passed=${passed}" >> "$GITHUB_OUTPUT"
          echo "Successful CI run on main for ${COMMIT}: ${passed}"

  validate:
    name: Validate
    needs: [tag, ci-status]
    if: needs.ci-status.outputs.passed != 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  immutable:
    name: Immutable version
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite version tags
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          image_prefix="${IMAGE_PREFIX,,}"
          for component in backend frontend printer-connector streaming-gateway local-updater; do
            image="${image_prefix}-${component}:${VERSION}"
            output_file="${RUNNER_TEMP}/${component}-manifest-check.txt"
            if docker buildx imagetools inspect "$image" >"$output_file" 2>&1; then
              echo "The immutable image tag already exists: $image"
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|name unknown|not found' "$output_file"; then
              cat "$output_file"
              echo "Could not safely confirm that $image is unused."
              exit 1
            fi
          done

  publish:
    name: Publish (${{ matrix.component }})
    needs: [tag, ci-status, validate, immutable]
    # `validate` is skipped when CI already passed for this commit. Publishing needs either a
    # successful validation or that proof, and never continues after a failed or cancelled job.
    if: >-
      ${{ !cancelled() && needs.tag.result == 'success' && needs.immutable.result == 'success' &&
      (needs.validate.result == 'success' ||
      (needs.validate.result == 'skipped' && needs.ci-status.outputs.passed == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: backend/Dockerfile
          - component: frontend
            dockerfile: frontend/Dockerfile
          - component: printer-connector
            dockerfile: printer-connector/Dockerfile
          - component: streaming-gateway
            dockerfile: streaming-gateway/Dockerfile
          - component: local-updater
            dockerfile: local-updater/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Go is cross-compiled and the frontend is built once on the runner. QEMU is only needed for
      # the arm64 `RUN apk add` of the Alpine-based final stages; the frontend final stage has no RUN.
      - name: Set up QEMU
        if: matrix.component != 'frontend'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: final
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.tag.outputs.version }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record published digest
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### ${COMPONENT} image" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  public-images:
    name: Public release images
    needs: [tag, publish]
    # `publish` may run after a skipped `validate`; without this condition GitHub skips every
    # job downstream of a skipped one.
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify anonymous image access
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          image_prefix="${IMAGE_PREFIX,,}"
          for component in backend frontend printer-connector streaming-gateway local-updater; do
            image="${image_prefix}-${component}:${VERSION}"
            available=false
            for attempt in 1 2 3 4 5 6; do
              if docker buildx imagetools inspect "$image" >/dev/null; then
                available=true
                break
              fi
              sleep 10
            done
            if [ "$available" != true ]; then
              echo "Release image is not anonymously pullable: $image"
              echo "Set every GHCR package (backend, frontend, printer-connector, streaming-gateway, local-updater) to public before creating a release."
              exit 1
            fi
          done

  github-release:
    name: GitHub Release
    needs: [tag, public-images]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.public-images.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package production Compose bundle
        id: bundle
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          archive_path="$(./scripts/package-production-compose.sh "$VERSION" "$RUNNER_TEMP")"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          connector_archive_path="$(./scripts/package-printer-connector-compose.sh "$VERSION" "$RUNNER_TEMP")"
          echo "connector_archive_path=$connector_archive_path" >> "$GITHUB_OUTPUT"
          streaming_archive_path="$(./scripts/package-streaming-compose.sh "$VERSION" "$RUNNER_TEMP")"
          echo "streaming_archive_path=$streaming_archive_path" >> "$GITHUB_OUTPUT"
          local_services_archive_path="$(./scripts/package-local-services-compose.sh "$VERSION" "$RUNNER_TEMP")"
          echo "local_services_archive_path=$local_services_archive_path" >> "$GITHUB_OUTPUT"
          release_notes_path="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$release_notes_path"
          test -s "$release_notes_path"
          echo "release_notes_path=$release_notes_path" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMPOSE_BUNDLE: ${{ steps.bundle.outputs.archive_path }}
          CONNECTOR_COMPOSE_BUNDLE: ${{ steps.bundle.outputs.connector_archive_path }}
          STREAMING_COMPOSE_BUNDLE: ${{ steps.bundle.outputs.streaming_archive_path }}
          LOCAL_SERVICES_COMPOSE_BUNDLE: ${{ steps.bundle.outputs.local_services_archive_path }}
          RELEASE_NOTES: ${{ steps.bundle.outputs.release_notes_path }}
        run: gh release create "$RELEASE_TAG" "$COMPOSE_BUNDLE#Production Compose bundle" "$CONNECTOR_COMPOSE_BUNDLE#Printer Connector Compose bundle" "$STREAMING_COMPOSE_BUNDLE#Streaming Gateway Compose bundle" "$LOCAL_SERVICES_COMPOSE_BUNDLE#Local Services Compose bundle" --verify-tag --notes-file "$RELEASE_NOTES" --title "$RELEASE_TAG"
